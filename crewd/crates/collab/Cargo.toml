[package]
name = "crewd-collab"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
crewd-proto = { version = "0.1.0", path = "../proto" }
crewd-store = { version = "0.1.0", path = "../store" }
crewd-work = { version = "0.1.0", path = "../work" }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
