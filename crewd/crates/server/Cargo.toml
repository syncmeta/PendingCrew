[package]
name = "crewd-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
ring = "0.17.14"
anyhow = "1.0.104"
base64 = "0.22.1"
crewd-jev = { version = "0.1.0", path = "../jev" }
crewd-remote = { version = "0.1.0", path = "../remote" }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
crewd-collab = { version = "0.1.0", path = "../collab" }
crewd-exec = { version = "0.1.0", path = "../exec" }
crewd-proto = { version = "0.1.0", path = "../proto" }
crewd-store = { version = "0.1.0", path = "../store" }
crewd-term = { version = "0.1.0", path = "../term" }
crewd-wake = { version = "0.1.0", path = "../wake" }
crewd-work = { version = "0.1.0", path = "../work" }
libc = "0.2.190"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "backup", "limits"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["raw_value"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
uuid = { version = "1.27.0", features = ["v4"] }

[features]
# M3b / M3c 的测试夹具（`FakeSessionControl` 本来就是 pub；夹具模块挂在这个特性下，给 crewd 的集成测试用）。
testkit = ["dep:tempfile", "crewd-exec/testkit"]

[dev-dependencies]
h2 = "0.4.14"
http = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util", "rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
core-foundation = "0.10.1"
