[package]
name = "crewd-store"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
crewd-proto = { version = "0.1.0", path = "../proto" }
libc = "0.2.190"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time"] }
