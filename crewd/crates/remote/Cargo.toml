[package]
name = "crewd-remote"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
crewd-proto = { version = "0.1.0", path = "../proto" }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "=2.6.1"
x509-parser = { version = "=0.18.1", features = ["verify"] }
