[package]
name = "crewd-jev"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2.190"
regex-lite = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
