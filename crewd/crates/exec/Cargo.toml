[package]
name = "crewd-exec"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
crewd-term = { version = "0.1.0", path = "../term" }
libc = "0.2.190"
rustix = { version = "1", features = ["termios", "process", "fs", "stdio"] }
rustix-openpty = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync", "process", "net", "io-util"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Explicit synthetic enrollment observations; absent from ordinary production builds.
testkit = []
