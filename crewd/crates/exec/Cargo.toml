[package]
name = "crewd-exec"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rustix = { version = "1", features = ["termios", "process", "fs", "stdio"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync", "process", "net", "io-util"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
