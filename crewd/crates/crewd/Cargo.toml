[package]
name = "crewd"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crewd-exec = { version = "0.1.0", path = "../exec" }
crewd-legacy = { version = "0.1.0", path = "../legacy" }
crewd-proto = { version = "0.1.0", path = "../proto" }
crewd-server = { version = "0.1.0", path = "../server" }
crewd-store = { version = "0.1.0", path = "../store" }
dirs = "7.0.0"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "net", "sync", "time"] }

[dev-dependencies]
crewd-work = { path = "../work" }
# Direct dependency for exact owned PID signals; cached workspace version.
libc = "0.2.190"
# Read-only observation of the disposable live fixture; version already in the workspace lock.
rusqlite = { version = "0.40.2", features = ["bundled"] }
crewd-wake = { path = "../wake" }
crewd-collab = { path = "../collab" }
crewd-server = { path = "../server", features = ["testkit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["process", "macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[features]
# Owned synthetic process observations; no caller authority override.
testkit = ["crewd-server/testkit", "crewd-exec/testkit"]
