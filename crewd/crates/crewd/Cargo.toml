[package]
name = "crewd"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crewd-exec = { version = "0.1.0", path = "../exec" }
crewd-legacy = { version = "0.1.0", path = "../legacy" }
crewd-proto = { version = "0.1.0", path = "../proto" }
crewd-server = { version = "0.1.0", path = "../server" }
crewd-store = { version = "0.1.0", path = "../store" }
dirs = "7.0.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
