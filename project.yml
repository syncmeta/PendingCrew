name: PendingCrew
options:
  bundleIdPrefix: com.pendingname
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    minVersion: 2.4.0
    maxVersion: 3.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    minVersion: 1.0.0
    maxVersion: 2.0.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    minVersion: 0.5.0
    maxVersion: 1.0.0
# 签名策略**不写在这里** —— 在 `Config/Signing.xcconfig`（仓库默认值：ad-hoc，任何人
# clone 下来不改被跟踪的文件就能编）里，个人身份写进它 `#include?` 的
# `Config/Local.xcconfig`（gitignored，见 Config/Local.xcconfig.example）。
#
# 为什么要用 xcconfig 而不是写在下面的 settings.base 里：Xcode 的优先级是
# 「target 设置 > target xcconfig > project 设置 > project xcconfig」——
# 只要 DEVELOPMENT_TEAM 还留在 settings.base，它就会盖掉 xcconfig，本地覆盖
# 永远不生效。所以这几个键必须从 settings 里**彻底移走**。
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 发布工具链读这两个键（scripts/release/build-macos-update.sh 用
    # sed 从 project.yml 取 MARKETING_VERSION）；Info.plist 用
    # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) 变量替换，
    # 构建期 -MARKETING_VERSION=... 才能真正落进产物。对齐 apps/pendingbot。
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PendingCrew:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      # Sources/Mcp（McpServer/HookEmitter/McpHelperMain）编进 app：re-exec self ——
      # app 二进制带 --mcp-serve/--mcp-hook argv 时当 crew-comms helper 跑（PendingCrewEntry）。
      - path: Sources
      - path: Resources
      - path: Shared/AppUpdate
    scheme:
      testTargets:
        - PendingCrewTests
      gatherCoverageData: false
    # 版本戳地基(Shared/)：把「这个产物从哪个 commit 出的」写进产物
    # Info.plist。跑在 code signing 之前，所以不会让签名失效。
    # basedOnDependencyAnalysis: false —— 没有输入/输出文件可声明，必须每次
    # 构建都跑，否则增量构建会沿用上一次的戳（戳就成了谎报）。
    postBuildScripts:
      - name: Stamp build info
        script: |
          "$SRCROOT/Shared/scripts/stamp-build-info.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]
      - package: SwiftMath
        product: SwiftMath
      - package: SwiftTerm
      - package: TOMLKit
        product: TOMLKit
    settings:
      base:
        # macOS 的嵌入式框架在 Contents/Frameworks、可执行文件在 Contents/MacOS，
        # 所以 rpath 必须是 `../Frameworks`。XcodeGen 对 supportedDestinations 多端
        # target 只生成 iOS 约定的 `@executable_path/Frameworks`，那会解析到
        # Contents/MacOS/Frameworks —— 那儿什么都没有。
        # 2026-08-06 实测：Sparkle 是本 app 第一个**嵌入式二进制框架**（其余 SPM
        # 依赖都编进主二进制了），所以这个缺失以前从没暴露；加了 Sparkle 之后
        # macOS 版**编译链接全过、一启动就 dyld "Library not loaded" SIGABRT**。
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew
        PRODUCT_NAME: PendingCrew
        # CODE_SIGN_ENTITLEMENTS **故意不写在这里** —— 它跟签名身份是一套，
        # 一起放在 Config/Signing.xcconfig / Config/Local.xcconfig（理由见 Config/Signing.xcconfig）。
        # 写在 target settings 里会盖掉 project 级 xcconfig，让本地覆盖失效。
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 1,2 = iPhone + iPad（对齐 apps/pendingbot）。曾是 "2"(仅 iPad) ——
        # 那会让 `simctl install` 到 iPhone 被系统直接拒（"app is compatible
        # with (2) but this device supports (1)"）。iPhone 形态见
        # Sources/Views/IPadShell.swift 的 compact 分支。
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
  # PendingCrewTests —— macOS-only XCTest bundle for LocalRunner module.
  # 不挂 iOS，因为待测代码全在 `#if os(macOS)` guard 后面。
  PendingCrewTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests/PendingCrewTests
        # Fixtures/ 是**不入 git** 的真实群聊数据（#443，见 .gitignore +
        # scripts/make-chat-fixtures.sh）。必须排掉：否则 xcodegen 会把当时碰巧
        # 存在的那几个文件名逐个写进 pbxproj，干净机器上一 regen 就 diff、
        # 而且 pbxproj 里会引用根本不存在的文件。测试是用 `#filePath` 从磁盘读的，
        # 本来就不需要它们进 bundle 资源。
        # 排掉整个 Fixtures/ 而不只是里面那一份数据：只排里面的文件，xcodegen
        # 仍会为**目录本身**写一个空 PBXGroup 进 pbxproj —— 而这个目录只在
        # 取过 fixture 的机器上存在。于是提交进来的 pbxproj 带不带这个空组，
        # 取决于生成它的那台机器上有没有那份不入 git 的数据，干净机器一 regen
        # 就 diff。2026-08-20 由 CI 的漂移检查在第一次跑时抓到。
        excludes:
          - "Fixtures"
          - "Fixtures/**"
      # 直接把 LocalRunner 源码编进 test bundle 而不是从 app 链接 ——
      # scaffold 阶段 app 不签名，无法做完整 macOS host-app injection；
      # bundle_loader + 无 test host 又会触发 dlopen 时 swift symbol 找不到。
      # LocalRunner 模块是纯 Foundation 代码（不依赖 SwiftUI / NSApplicationMain），
      # 重复编译进 test bundle 完全没问题。
      - path: Sources/Mac/LocalRunner
      # SessionProxy codec + WS transport（遥控 Step 0：从 Sources/Mac/LocalRunner
      # 搬进三端共用的 Sources/Remote 后，不再随 LocalRunner 整目录进 bundle）。
      # SessionProxyProtocolTests 单测 codec；SessionPermissionRelay.swift（仍在
      # LocalRunner）引用 SessionProxyClient，所以两个都要带上。纯 Foundation。
      - path: Sources/Remote/SessionProxyProtocol.swift
      - path: Sources/Remote/SessionProxyClient.swift
      # 多进程 JSON 文件 store 基座（#528：flock / 逐条 lenient / corrupt 归档），
      # 白板 + todos/approvals/wakeups 共用。自包含 Foundation。
      - path: Sources/Stores/MultiProcessJSONStore.swift
      # LocalWhiteboardStore 同理：自包含 Foundation 代码（本地白板持久化，
      # 不引 CrewWhiteboardEntry / app module），单独编进 bundle 单测。
      - path: Sources/Stores/LocalWhiteboardStore.swift
      # 目录监听的合流 + 相关性判定（#443 点进群聊转彩虹圈）。纯 Foundation，
      # LocalWhiteboardStore 依赖它，所以 test bundle 也要带上。
      - path: Sources/Stores/DirectoryWatchCoalescing.swift
      # 侧栏「每个 crew 末条消息」的指纹门控缓存（2026-08-17：开久了卡的头号病根）。
      # 纯 Foundation，只依赖上面两个 —— 所以「一次目录 tick 到底真解码几次」能脱离
      # app 直接单测 + 基准（CrewLastMessageCacheTests）。
      - path: Sources/Stores/CrewLastMessageCache.swift
      # 指纹门控缓存底座（2026-08-18 抽出，上面那个和下面那个共用同一套）。
      - path: Sources/Stores/FileFingerprintCache.swift
      # 点名快照那 2 秒一拍要的两样磁盘输入（审批账本 + 回合 marker）的指纹门控
      # 缓存（「开久了卡」第三条）。依赖 LocalApprovalStore / SessionTurnTrace，
      # 两个都已在 bundle —— 所以「一拍到底真读了几次」能脱离 app 直接单测。
      - path: Sources/Stores/SessionAwaitingReplyInputsCache.swift
      # 白板消息 → session 注入面的可见性判定（#543 定向 @ 扩散根因修复）。
      # hook 注入路 / 收听路 / 唤醒上下文共用同一份标准，纯 Foundation。
      - path: Sources/Stores/CrewWhiteboardVisibility.swift
      # 待审批/待决策 store（ask 工具 + 权限 hook 用），同自包含。
      - path: Sources/Stores/LocalApprovalStore.swift
      # 定时唤醒账本（schedule_wakeup 持久化，#528 从 runner 抽出），同自包含。
      - path: Sources/Stores/LocalWakeupStore.swift
      # agent 侧会话号账本（Todo #28：重启成员时 --resume / thread/resume 回原对话），同自包含。
      - path: Sources/Stores/LocalAgentSessionStore.swift
      # 人类 Todo 列表 store（respond_todo 工具 + 右栏面板数据层），同自包含。
      - path: Sources/Stores/LocalTodoStore.swift
      # 机长作战板 store（Todo #66：plan_add/plan_update 工具 + 驾驶舱任务列表数据层）。
      # 同自包含 Foundation；模型与纯逻辑在 Sources/Models/CockpitPlan.swift（整个
      # Sources/Models 已在 bundle 里，不必单列）。
      - path: Sources/Stores/CockpitPlanStore.swift
      # crew-naming（2026-06-17）：控制通道 store（机长 rename_crew 写待改名）+
      # LocalCrewStore（setTitle/地名兜底）+ PlaceNames（地名池）。均自包含 Foundation；
      # PlaceNames 读 Bundle.main，测试 bundle 无 crewground_places.txt → 回落 ["Atlantis"]，
      # 不崩，断言「非『未命名』」仍成立。
      - path: Sources/Stores/LocalCrewControlStore.swift
      - path: Sources/Stores/LocalCrewStore.swift
      - path: Sources/Stores/PlaceNames.swift
      # 新建 crew 的「最近工作目录」MRU 纯逻辑（Todo #29）。纯 Foundation，自包含。
      - path: Sources/Stores/RecentWorkingDirectories.swift
      # 成员状态快照（机长 list_sessions 数据源，纯 Foundation Codable）。
      - path: Sources/Stores/CrewSessionsSnapshot.swift
      # 通讯录（2026-08-11）：号码解析 + 全机汇总 + contact 寻址。纯 Foundation，
      # 依赖 LocalCrewStore.swift 的 LocalCrew / LocalCrewFile 与上面的快照类型
      # （都已编进 bundle），所以整套编号/寻址逻辑能脱离 app 单测。
      - path: Sources/Stores/CrewDirectory.swift
      # 家族 SSO 凭据共享组存储（纯 Foundation+Security，自包含）。
      - path: Sources/Support/FamilyCredentialStore.swift
      # fd 软上限抬升（2026-08-12 P0 的触发闸）。纯 Darwin syscall + 一个可单测的
      # 纯判定函数，自包含。
      - path: Sources/Support/FileDescriptorLimit.swift
      # 机器分组纯函数（依赖 Models 里的 Machine / CrewSummary，已编进 bundle）。
      - path: Sources/Support/MachineGrouping.swift
      # 子 crew 深度 cap 纯判定（create_child_crew 机长命令）。CrewStore 依赖
      # AppModel（未编进 bundle），逻辑摘到这个自包含文件供单测直接编译。
      # crew 状态点聚合纯函数（侧栏头像右上角;红>黄>绿>灰）。自包含 Foundation。
      - path: Sources/Support/CrewStatusAggregation.swift
      # session 状态点语义（头像右下角那**唯一**一颗；绿=干活/黄=空闲/红=需要人
      # 出手/灰=已退出）。自包含 Foundation+SwiftUI(只用 Color)，与上面那套 crew
      # 级聚合是两回事，别混。
      - path: Sources/Support/SessionStatusDot.swift
      # 新起的 run 该不该跳过去（Todo #42：程序在背后起的不许抢用户正开着的那个）。
      # 纯 Foundation，自包含。
      - path: Sources/Support/SessionForegroundClaim.swift
      # 「这个 session 正在等人回复」的判定（Todo #25 层 2：待回复要标红）。
      # 纯 Foundation，自包含。
      - path: Sources/Support/SessionAwaitingReply.swift
      # 人类回应「人类 Todo」后该叫醒谁（Todo #62 ②：提问 session 在跑 → 它；
      # 已退出 / 没记 / 机长自己提的 → 回落机长转达）。纯 Foundation，只依赖
      # CrewMention（Sources/Services/CrewModels.swift 已在 bundle）。
      - path: Sources/Support/HumanTodoWakePlan.swift
      # 侧栏拖拽改父子关系的判定层（Todo #27：禁环/移动语义/摘到顶层/负载编解码）。
      # 纯 Foundation，只依赖 CrewSummary（Sources/Models 已在 bundle）。
      - path: Sources/Support/CrewDragDropLogic.swift
      # 根祖先判定（crew 名字后面那行黄字标注：标的是最顶层的根 crew，多父就是多个）。
      # 纯 Foundation，只依赖 CrewSummary（Sources/Models 已在 bundle）。
      - path: Sources/Support/CrewRootLineage.swift
      # 侧栏行右键「在这下面建子 crew」的目标解析（Todo #35：钉死作用于被右键的
      # 那一行，不看选中态 / 不看父边）。同上，纯 Foundation + CrewSummary。
      - path: Sources/Support/CrewChildCreationTarget.swift
      # 白板/crew 时间戳解析 + crew「最新活动时间」口径（侧栏两种视图共用的单一
      # 真值）。CrewTimeSeparator 转发到它 —— 纯 Foundation，所以能进 test bundle。
      - path: Sources/Support/CrewTimestamp.swift
      # 侧栏时间流视图的排序 / 血缘次要行 / 视图模式持久化（Todo #50）。
      # 纯 Foundation，依赖 CrewSummary + CrewTimestamp（都已在 bundle）。
      - path: Sources/Support/CrewTimelineOrdering.swift
      # 侧栏层级视图按最新活动排序（Todo #67：父的键 = max(自己, 全部后代)）。
      # 同上，纯 Foundation。
      - path: Sources/Support/CrewHierarchyOrdering.swift
      # create_child_crew brief 的启动 payload + fail-loud 回执纯逻辑（Todo #41）。
      - path: Sources/Support/CaptainBriefDelivery.swift
      # 「正在输入」圆点（CoreAnimation 驱动）—— 布局自激回归测试要直接跑线上这版。
      # 自包含 SwiftUI+AppKit，不引 Theme/CrewSessionRun。
      - path: Sources/Mac/Views/Chat/TypingDotsLayerView.swift
      # Todo 状态圆圈的呼吸（同样 CoreAnimation 驱动，2026-08-10 第二条自激的修复）——
      # 布局自激回归测试要直接跑线上这版。自包含 SwiftUI+AppKit，不引 Theme。
      - path: Sources/Mac/Views/BreathingSymbolView.swift
      # 「需要人出手」的呼吸红点（同样 CoreAnimation 驱动）—— 布局自激回归测试
      # 要直接跑线上这版。自包含 SwiftUI+AppKit/UIKit。
      - path: Sources/Views/BreathingDotView.swift
      # Todo 列表展示纯逻辑（#4/#5 从新到旧排序 + #11 状态→圆圈图标映射）。
      # 依赖 LocalTodoItem（LocalTodoStore.swift 已编进 bundle），纯 Foundation。
      - path: Sources/Support/TodoListPresentation.swift
      # 额度圆环判定层（Todo #8/#10：颜色阈值 / 窗口→环映射 / 模型名字段 /
      # 快照新鲜度）。依赖 AgentQuota.swift 的类型（已随 LocalRunner 编进 bundle）。
      - path: Sources/Support/QuotaRingLayout.swift
      # 自绘终端滚动条的几何换算（Todo #34）：knob 长度/位置 ↔ 拖动位置互逆。
      # 纯 CoreGraphics，自包含。
      - path: Sources/Support/TerminalScrollbarGeometry.swift
      # 本地 prompts：PromptTemplate（纯 {{var}}）+ LocalPromptLoader（bundle 读）
      # 自包含，编进 bundle 单测；Resources/Prompts 作为 test bundle 资源，从
      # test bundle 加载验证 bundling + lookup 端到端。
      - path: Sources/Stores/PromptTemplate.swift
      - path: Sources/Stores/LocalPromptLoader.swift
      - path: Sources/Stores/LocalSessionWorldModel.swift
      # McpServer.swift / HookEmitter.swift（纯逻辑，不含 main.swift 顶层代码）编进
