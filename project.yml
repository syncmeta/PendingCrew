      - path: Sources/Mcp/McpServer.swift
      - path: Sources/Mcp/HookEmitter.swift
      # 未读游标单一真值（hook 路与唤醒/提及注入路共用），自包含 Foundation。
      - path: Sources/Mcp/WhiteboardCursor.swift
      - path: Sources/Mcp/McpPermissionHook.swift
      # 回合结束留痕（#25 层 1）：判定纯函数 + marker 记账 + Stop hook 宿主。
