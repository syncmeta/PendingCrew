      - path: Sources/Chat/Adapter/CrewComposerMentions.swift
      # CrewSessionTitle.swift：session 精简标题 clamp/derive（≤18 字、剥项目名）。纯 Foundation。
      - path: Sources/Chat/Adapter/CrewSessionTitle.swift
      # CrewPasteAttachments.swift（Todo #9）：剪贴板快照 → 附件的优先级判定 +
