      - path: Sources/Chat/Adapter/CrewChatBottomFollow.swift
      # CrewComposerDrafts.swift（Todo #45 配套）：每 crew 未发出草稿的内存态。
      # 只依赖 CrewStagedMention / CrewReplyTarget（均已在 bundle）。
      - path: Sources/Chat/Adapter/CrewComposerDrafts.swift
      # CrewModels.swift：从 PendingCrewAPI.swift 提取的 whiteboard/crew 纯
      # Foundation 模型（CrewWhiteboardEntry / CrewMember / CrewAttachment 等），
      # 不含 PendingCrewAPI 类或 URLSession 依赖。
      - path: Sources/Services/CrewModels.swift
      # CrewRealtimeClient.swift：crew 级 hub WS 客户端 + codec（纯 Foundation，
      # 跨平台）。原在 Sources/Mac/LocalRunner（随整目录编进 bundle），移到
      # Sources/Services 后需显式列出 —— CrewRealtimeClientTests 单测 codec。
      - path: Sources/Services/CrewRealtimeClient.swift
      # Sources/Models/（CrewDetail / CrewSummary / UserSubject / DeviceLogin /
      # ModelCatalogEntry）：LocalRunner 传递引用了这些类型。
      - path: Sources/Models
      # Shared/AppUpdate（版本戳 + 更新检查闸门）：纯 Foundation，直接编进 bundle 单测。
      - path: Shared/AppUpdate/UpdateCheckGate.swift
      - path: Shared/AppUpdate/AppBuildStamp.swift
    # AgentTerminalSession.swift（在 LocalRunner 里）import SwiftTerm，所以
    # test bundle 也要链 SwiftTerm，否则编不过。
    # WorkspaceSync/WorkspaceManifest.swift import TOMLKit，同理 test bundle 直编
    # 源码需要直接链 TOMLKit。
    dependencies:
      - package: SwiftTerm
      - package: TOMLKit
        product: TOMLKit
      # MarkdownUI / SwiftMath：MarkdownText.swift 直编进 bundle 后需要它们
      # （#443 主线程渲染成本测量要跑线上那版 markdown 渲染，不能拿仿制品量）。
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftMath
        product: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pendingname.pendingcrew.tests
        GENERATE_INFOPLIST_FILE: YES
        # standalone test bundle —— 不挂 host app
        TEST_HOST: ""
        BUNDLE_LOADER: ""
