      # CrewMentionPickerLayout.swift（Todo #69）：@-候选浮层的限高判定（可用高度 +
      # 行数 + 行高 → maxHeight）。纯 CoreGraphics 几何，不碰 SwiftUI —— GUI 验不了，
      # 能被测试钉住的那部分必须钉住。
      - path: Sources/Chat/Adapter/CrewMentionPickerLayout.swift
      # ── #443 主线程渲染成本的可量化基座 ────────────────────────────────────
      # `CrewChatOpenCostTests` 要拿**线上这版** MarkdownText 在离屏 NSHostingView
      # 里量真实的 70 条消息，所以整条 markdown 渲染链要编进 test bundle。这一组
      # 都是自包含的 SwiftUI/Foundation 文件（不引 AppModel / 后端 / Supabase），
      # 顺序无关，缺一个就编不过：
      #   Theme ← Platform / ColorHex / ColorHash / AppearanceMode / ThemeCrewExtras
      #   MarkdownText ← Theme / MathRendering(SwiftMath) / Haptics / MessageCitation
      #   CrewBubbleTextSelection：`crewBubbleSelectable` 环境值（按需 textSelection）
      - path: Sources/Chat/Vendored/Platform.swift
      - path: Sources/Chat/Vendored/ColorHex.swift
      - path: Sources/Chat/Vendored/ColorHash.swift
      - path: Sources/Chat/Vendored/AppearanceMode.swift
      - path: Sources/Chat/Vendored/Theme.swift
      - path: Sources/Chat/Vendored/AppThemeAlias.swift
      - path: Sources/Chat/Adapter/ThemeCrewExtras.swift
      - path: Sources/Chat/Vendored/Haptics.swift
      - path: Sources/Chat/Vendored/PlatformImage.swift
      - path: Sources/Chat/Vendored/MathRendering.swift
      # MathMarkup.swift：从 MathRendering.swift 切出来的纯 Foundation 字符串层
      # （围栏/行内代码分段 + 数学重写）。MathRendering 仍需要它，且
      # MathMarkupFenceTests 就靠它把「围栏经重写后必须原样还在」钉成单测。
      - path: Sources/Chat/Vendored/MathMarkup.swift
      - path: Sources/Chat/Vendored/MarkdownText.swift
      - path: Sources/Chat/Adapter/CrewBubbleTextSelection.swift
      # CrewChatBottomFollow.swift（Todo #45）：群聊「跟随底部」判定 —— 在不在底部、
