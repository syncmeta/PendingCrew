# 这条流水线只守 CONTRIBUTING 里那三条硬规矩，**不出包**。
#
# 签名证书和 Apple 公证凭据**一律不进 GitHub secrets** —— 那把 Developer ID
# 证书能签任何冒充身份的 app，放进 CI 等于把它交给每一个能触发 workflow 的人。
# 出包继续走本地那条路（scripts/release/build-macos-update.sh）。所以下面每一步
# 都是**不需要任何凭据**的：仓库默认走 ad-hoc 签名（Config/Signing.xcconfig），headless
# 无证书环境能编能测。
name: CI

on:
  workflow_dispatch:
  # **push 上故意不设 paths-ignore。** 它在 push 事件上按「这一推的 head 提交
  # 动了哪些文件」来判，不是按整推的合计 —— 而发版流程的最后一笔惯例是
  # 只改 CHANGELOG.md。2026-08-26 发 0.1.17 时一次推了 28 笔，head 正好是那笔
  # 纯 .md，**整条流水线一次都没被触发**（`?head_sha=` 查回 total_count 0），
  # 28 笔代码就这么进了公开 main 且从没被 CI 看过一眼。
  # 省下的是几分钟机器时间（public 仓库的 macOS runner 免费），赔进去的是
  # 「main 被验过」这个前提本身。不划算，所以不设。
  push:
    branches: [main]
  # PR 上保留：这里的过滤按整个 PR 的 diff 判，不会被最后一笔提交带偏。
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']

# 同一个分支上新的推送把旧的跑掉 —— macOS runner 很贵，别让排队的旧 commit
# 白烧分钟数。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # **钉死 Xcode 版本，不用 runner 镜像的默认值。** 镜像升级会静默换掉编译器，
  # 表现成「昨天绿的今天红了、代码一个字没动」——最难查的一类 CI 故障。
  # 26.5 (17F42) = 开发机上的那一版，两边编译器一致。
  XCODE: /Applications/Xcode_26.5.app

jobs:
  # 单独一个 job，不跟全量编译排一起：它最快，而且抓的是**唯一一种本机永远
  # 看不到红**的错 —— 加了 Swift 文件没 regen，提交者自己能编（Xcode 会自己
  # 发现文件），别人 clone 下来那份 pbxproj 里没有它，只在别人机器上炸。
  project-drift:
    name: pbxproj 与 project.yml 同步
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # **不是 `brew install xcodegen`。** 装的是 `.xcodegen-version` 声明的那一版
      # （脚本自己按 scripts/xcodegen-checksums.txt 校验下载产物），这样 CI 和
      # 开发机对齐的是仓库里的一个数字，而不是各自 brew 的当日状态 —— 否则上游
      # 一升级，所有人的 PR 同时变红，包括每一个什么都没做错的人。
      - name: 按仓库声明的版本生成工程
        run: scripts/gen-project.sh --fetch
      - name: 检查生成物有没有漂移
        run: |
          if ! git diff --exit-code; then
            echo "::error::project.yml 和提交进来的 .pbxproj 对不上。"
            echo "::error::在本地跑 \`scripts/gen-project.sh\` 然后把 PendingCrew.xcodeproj/project.pbxproj 一起提交。"
            echo "::error::新增 Swift 文件也算改了工程定义 —— 你本机能编，别人 clone 下来编不过。"
            echo "::error::（生成器版本已由 .xcodegen-version 钉死，所以这个差异不会是版本引起的。）"
            exit 1
          fi

  # **push / PR / 手动触发都跑。** 实测冷机一次 13 分 26 秒（macOS 编译+单测
  # 9'45"、iOS 端编译 3'12"）。
  #
  # 这里原本挂着 `if: github.event_name != 'push'`，理由是 private 仓库的 macOS
  # runner 按 10 倍计费、Free 档一个月只够跑十几次，而那句注释自己写了「仓库转
  # public 之后 macOS runner 免费，那时可以把这条 if 去掉」。**仓库已经是 public
  # 了，所以去掉。**
  #
  # 拖到现在才去掉的代价是真实的，记在这儿别再犯：2026-08-26 发 0.1.17 时一次
  # 推了 28 笔到 main，这个 job 被这条 if 全部跳过，而流水线整体判定是
  # **success** —— 页面上一片绿，底下压着 28 笔从没被编译过的改动。**一个会
  # 跳过主检查、却仍然报绿的流水线，比一个红的更糟：红的会叫，绿的不会。**
  build-test:
    name: 三端编译 + 单测
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 钉住 Xcode
        run: |
          test -d "$XCODE" || {
            echo "::error::$XCODE 不在这台 runner 上。镜像里现有的："
            ls -d /Applications/Xcode*.app
            exit 1
          }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # SPM 解析结果按 Package.resolved 的哈希缓存 —— 23 个依赖，冷机每次重解
      # 是这条流水线里最没意义的一段等待。key 里带 Xcode 版本：换编译器要重解。
      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ env.XCODE }}-${{ hashFiles('PendingCrew.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ env.XCODE }}-

      - run: scripts/gen-project.sh --fetch

      - name: macOS 编译 + 单测
        run: |
          xcodebuild -project PendingCrew.xcodeproj -scheme PendingCrew \
            -destination 'platform=macOS' \
            -derivedDataPath DD -clonedSourcePackagesDirPath SourcePackages \
            build test

      # 三端共用一套源码：只编 Mac 会让漏了 `#if os(macOS)` 的 AppKit 调用
      # 把 iOS 端静默打红。`generic/platform=iOS Simulator` 只要 SDK，不需要
      # 装模拟器运行时。
      - name: iOS 端编译
        run: |
          xcodebuild -project PendingCrew.xcodeproj -scheme PendingCrew \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DD -clonedSourcePackagesDirPath SourcePackages \
            build
