# 这条流水线只守 CONTRIBUTING 里那三条硬规矩，**不出包**。
#
# 签名证书和 Apple 公证凭据**一律不进 GitHub secrets** —— 那把 Developer ID
# 证书能签任何冒充身份的 app，放进 CI 等于把它交给每一个能触发 workflow 的人。
# 出包继续走本地那条路（scripts/release/build-macos-update.sh）。所以下面每一步
# 都是**不需要任何凭据**的：仓库默认走 ad-hoc 签名（Config/Signing.xcconfig），headless
# 无证书环境能编能测。
name: CI

# 完整冻结后由统筹按必要影响范围手动派发，不在 push / PR 重复全量检查。
run-name: Apple frozen full checks (explicit)
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # **钉死 Xcode 版本，不用 runner 镜像的默认值。** 镜像升级会静默换掉编译器，
  # 表现成「昨天绿的今天红了、代码一个字没动」——最难查的一类 CI 故障。
  # 验收固定为 26.5 (17F42)；本机新版编译器通过不能替代这项检查。
  XCODE: /Applications/Xcode_26.5.app

jobs:
  # 单独一个 job，不跟全量编译排一起：它最快，而且抓的是**唯一一种本机永远
  # 看不到红**的错 —— 加了 Swift 文件没 regen，提交者自己能编（Xcode 会自己
  # 发现文件），别人 clone 下来那份 pbxproj 里没有它，只在别人机器上炸。
  project-drift:
    name: pbxproj 与 project.yml 同步
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # **不是 `brew install xcodegen`。** 装的是 `.xcodegen-version` 声明的那一版
      # （脚本自己按 scripts/xcodegen-checksums.txt 校验下载产物），这样 CI 和
      # 开发机对齐的是仓库里的一个数字，而不是各自 brew 的当日状态 —— 否则上游
      # 一升级，所有人的 PR 同时变红，包括每一个什么都没做错的人。
      - name: 按仓库声明的版本生成工程
        run: scripts/gen-project.sh --fetch
      - name: 检查生成物有没有漂移
        run: |
          if ! git diff --exit-code; then
            echo "::error::project.yml 和提交进来的 .pbxproj 对不上。"
            echo "::error::在本地跑 \`scripts/gen-project.sh\` 然后把 PendingCrew.xcodeproj/project.pbxproj 一起提交。"
            echo "::error::新增 Swift 文件也算改了工程定义 —— 你本机能编，别人 clone 下来编不过。"
            echo "::error::（生成器版本已由 .xcodegen-version 钉死，所以这个差异不会是版本引起的。）"
            exit 1
          fi

  # 手动完整检查保留实际 macOS 编译、单测和 iOS SDK 编译。
  build-test:
    name: 三端编译 + 单测
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 钉住 Xcode
        run: |
          test -d "$XCODE" || {
            echo "::error::$XCODE 不在这台 runner 上。镜像里现有的："
            ls -d /Applications/Xcode*.app
            exit 1
          }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # SPM 解析结果按 Package.resolved 的哈希缓存 —— 23 个依赖，冷机每次重解
      # 是这条流水线里最没意义的一段等待。key 里带 Xcode 版本：换编译器要重解。
      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ env.XCODE }}-${{ hashFiles('PendingCrew.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ env.XCODE }}-

      - run: scripts/gen-project.sh --fetch

      - name: 读取普通 Core 的固定工具链
        id: core-toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crewd/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.core-toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crewd

      # 普通 App 必须嵌入准确的普通 Core；沿用正式来源记录器，不跳过嵌入检查。
      - name: 构建并记录同版本普通 Core
        working-directory: crewd
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          cargo fetch --locked
          python3 ../scripts/dev/record-crewd-build.py prepare \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/apple-core-evidence" "$GITHUB_SHA"
          python3 ../scripts/dev/record-crewd-build.py build \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/apple-core-evidence" \
            "$GITHUB_WORKSPACE/crewd/target/release/crewd" \
            cargo build --release --locked --offline -p crewd --bin crewd --message-format=json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          witness = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apple-core-evidence-witness.json'
          value = json.loads(witness.read_text())
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apple-core-evidence' / value['binaryFile']
          assert value['sourceRef'] == os.environ['GITHUB_SHA']
          assert value['freshWorkspaceArtifacts'] is True
          assert value['buildConfiguration']['artifactProfile']['test'] is False
          assert all('testkit' not in features for features in value['buildConfiguration']['workspaceFeatures'].values())
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == value['binarySHA256']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PENDINGCREW_BACKEND_INPUT=' + str(binary) + '\n')
              env.write('PENDINGCREW_BACKEND_SHA256=' + value['binarySHA256'] + '\n')
          PY

      - name: macOS 编译 + 单测
        run: |
          xcodebuild -project PendingCrew.xcodeproj -scheme PendingCrew \
            -destination 'platform=macOS' \
            -derivedDataPath DD -clonedSourcePackagesDirPath SourcePackages \
            -skip-testing:PendingCrewTests/HelperBuildPerMemberTests \
            PENDINGCREW_PRODUCT_SOURCE_REF="$GITHUB_SHA" \
            PENDINGCREW_BACKEND_INPUT="$PENDINGCREW_BACKEND_INPUT" \
            PENDINGCREW_BACKEND_SHA256="$PENDINGCREW_BACKEND_SHA256" \
            build test

      # 三端共用一套源码：只编 Mac 会让漏了 `#if os(macOS)` 的 AppKit 调用
      # 把 iOS 端静默打红。`generic/platform=iOS Simulator` 只要 SDK，不需要
      # 装模拟器运行时。
      - name: iOS 端编译
        run: |
          xcodebuild -project PendingCrew.xcodeproj -scheme PendingCrew \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DD -clonedSourcePackagesDirPath SourcePackages \
            PENDINGCREW_PRODUCT_SOURCE_REF="$GITHUB_SHA" \
            build

      - name: 保留普通 Core 的准确构建记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-normal-core-evidence
          path: |
            ${{ runner.temp }}/apple-core-evidence
            ${{ runner.temp }}/apple-core-evidence-witness.json
          if-no-files-found: ignore
