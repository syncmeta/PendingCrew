# 这条流水线只守 CONTRIBUTING 里那三条硬规矩，**不出包**。
#
# 签名证书和 Apple 公证凭据**一律不进 GitHub secrets** —— 那把 Developer ID
# 证书能签任何冒充身份的 app，放进 CI 等于把它交给每一个能触发 workflow 的人。
# 出包继续走本地那条路（scripts/release/build-macos-update.sh）。所以下面每一步
# 都是**不需要任何凭据**的：仓库默认走 ad-hoc 签名（Config/Signing.xcconfig），headless
# 无证书环境能编能测。
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']

# 同一个分支上新的推送把旧的跑掉 —— macOS runner 很贵，别让排队的旧 commit
# 白烧分钟数。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # **钉死 Xcode 版本，不用 runner 镜像的默认值。** 镜像升级会静默换掉编译器，
  # 表现成「昨天绿的今天红了、代码一个字没动」——最难查的一类 CI 故障。
  # 26.5 (17F42) = 开发机上的那一版，两边编译器一致。
  XCODE: /Applications/Xcode_26.5.app

jobs:
  # 单独一个 job，不跟全量编译排一起：它最快，而且抓的是**唯一一种本机永远
  # 看不到红**的错 —— 加了 Swift 文件没 regen，提交者自己能编（Xcode 会自己
  # 发现文件），别人 clone 下来那份 pbxproj 里没有它，只在别人机器上炸。
  project-drift:
    name: pbxproj 与 project.yml 同步
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: 装 xcodegen
        run: |
          brew install xcodegen
          # 版本**故意不钉死**：钉死会让 brew 每次例行升级都制造一次假红。
          # 但版本要打进日志，并写进下面的失败提示 —— 生成器版本变了导致的
          # pbxproj 差异，症状和「你忘了 regen」一模一样，没有这一行，
          # 下一个人会先花半天怀疑自己。
          echo "XCODEGEN_VERSION=$(xcodegen --version | tr -d '\n')" >> "$GITHUB_ENV"
      - run: xcodegen generate
      - name: 检查生成物有没有漂移
        run: |
          if ! git diff --exit-code; then
            echo "::error::project.yml 和提交进来的 .pbxproj 对不上。"
            echo "::error::在本地跑 \`xcodegen\` 然后把 PendingCrew.xcodeproj/project.pbxproj 一起提交。"
            echo "::error::新增 Swift 文件也算改了工程定义 —— 你本机能编，别人 clone 下来编不过。"
            echo "::error::差异只有几个 id / 分组时，先对一下版本：CI 这台跑的是 ${XCODEGEN_VERSION}。"
            exit 1
          fi

  # **只在 PR 和手动触发时跑，不跟着每次 push main。**
  # 实测冷机一次 13 分 26 秒（macOS 编译+单测 9'45"、iOS 端编译 3'12"）。
  # private 仓库的 macOS runner 按 10 倍计费 —— 一次就是约 140 分钟额度，
  # Free 档一个月的量只够跑十几次。而 push main 这条路上的人本来就在本地
  # 编过测过；真正只有机器抓得住的是上面那个漂移检查，它 12 秒、便宜到可以
  # 每次都跑。仓库转 public 之后 macOS runner 免费，那时可以把这条 if 去掉。
  build-test:
    name: 三端编译 + 单测
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 钉住 Xcode
        run: |
          test -d "$XCODE" || {
            echo "::error::$XCODE 不在这台 runner 上。镜像里现有的："
            ls -d /Applications/Xcode*.app
            exit 1
          }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: brew install xcodegen

      # SPM 解析结果按 Package.resolved 的哈希缓存 —— 23 个依赖，冷机每次重解
      # 是这条流水线里最没意义的一段等待。key 里带 Xcode 版本：换编译器要重解。
      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ env.XCODE }}-${{ hashFiles('PendingCrew.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ env.XCODE }}-

      - run: xcodegen generate

      - name: macOS 编译 + 单测
        run: |
          xcodebuild -project PendingCrew.xcodeproj -scheme PendingCrew \
            -destination 'platform=macOS' \
            -derivedDataPath DD -clonedSourcePackagesDirPath SourcePackages \
            build test

      # 三端共用一套源码：只编 Mac 会让漏了 `#if os(macOS)` 的 AppKit 调用
      # 把 iOS 端静默打红。`generic/platform=iOS Simulator` 只要 SDK，不需要
      # 装模拟器运行时。
      - name: iOS 端编译
        run: |
          xcodebuild -project PendingCrew.xcodeproj -scheme PendingCrew \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DD -clonedSourcePackagesDirPath SourcePackages \
            build
