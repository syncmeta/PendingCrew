          recovery_codex_sha=$(python3 -c 'import json,os,pathlib;print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"core14-recovery/fake-artifacts.json").read_text())["fake_codex"]["sha256"])')
          recovery_claude_sha=$(python3 -c 'import json,os,pathlib;print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"core14-recovery/fake-artifacts.json").read_text())["fake_claude"]["sha256"])')
          python3 -B scripts/dev/fixtures/crewd-recovery-public-restart.py --binary "$RUNNER_TEMP/core14-recovery/normal/crewd-presign" --witness "$RUNNER_TEMP/core14-recovery/normal-witness.json" --expected-source-ref "$GITHUB_SHA" --fake-codex "$RUNNER_TEMP/core14-recovery/fakes/fake_codex" --fake-codex-sha "$recovery_codex_sha" --fake-claude "$RUNNER_TEMP/core14-recovery/fakes/fake_claude" --fake-claude-sha "$recovery_claude_sha" --out "$parent/flow/public"
          python3 -B scripts/dev/fixtures/crewd-recovery-public-stop.py --binary "$RUNNER_TEMP/core14-recovery/normal/crewd-presign" --witness "$RUNNER_TEMP/core14-recovery/normal-witness.json" --expected-source-ref "$GITHUB_SHA" --fake-codex "$RUNNER_TEMP/core14-recovery/fakes/fake_codex" --fake-codex-sha "$recovery_codex_sha" --fake-claude "$RUNNER_TEMP/core14-recovery/fakes/fake_claude" --fake-claude-sha "$recovery_claude_sha" --out "$parent/flow/stop"
          python3 -B scripts/dev/fixtures/crewd-recovery-closed-guards.py --binary "$RUNNER_TEMP/core14-recovery/normal/crewd-presign" --witness "$RUNNER_TEMP/core14-recovery/normal-witness.json" --expected-source-ref "$GITHUB_SHA" --source-data "$parent/flow/public/data" --out "$parent/flow/guards"
          python3 - <<'PYSTABLE'
          import hashlib,json,os,pathlib
          e=pathlib.Path(os.environ['RUNNER_TEMP'])/'core14-recovery';normal=json.loads((e/'normal-witness.json').read_text())
          assert hashlib.sha256((e/'normal/crewd-presign').read_bytes()).hexdigest()==normal['binarySHA256']
          for row in json.loads((e/'fake-artifacts.json').read_text()).values():assert hashlib.sha256(pathlib.Path(row['path']).read_bytes()).hexdigest()==row['sha256']
          (e/'runtime-binaries-stable.json').write_text(json.dumps({'normalUnchanged':True,'fakeInputsUnchanged':True,'sourceRef':os.environ['GITHUB_SHA']},indent=2))
          PYSTABLE
      - name: Archive diagnostic physical facts without deleting special inodes or dereferencing links
        if: ${{ always() && steps.physical.outputs.parent != '' }}
        env:
          PHYSICAL_ROOT: ${{ steps.physical.outputs.parent }}/flow
        run: |
          python3 -B scripts/dev/archive-crewd-linux-lifecycle.py "$PHYSICAL_ROOT" "$RUNNER_TEMP/core14-recovery/physical.tar.gz" --diagnostic-special-inodes
          python3 - <<'PYARCHIVE'
          import hashlib,json,os,pathlib,tarfile
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'core14-recovery'
          path=evidence/'physical.tar.gz';manifest=json.loads(path.with_suffix('.gz.json').read_text())
          assert manifest['diagnosticSpecialInodes'] is True and manifest['restorableCompleteFilesystem'] is False and manifest['specialContentsCaptured'] is False
          assert manifest['dereference'] is False and manifest['sourceDirectory']==os.environ['PHYSICAL_ROOT']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==manifest['archiveSHA256']
          with tarfile.open(path) as archive:
              members={m.name.removeprefix('flow/'):m for m in archive.getmembers() if m.name!='flow'}
              for member in archive.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and (member.isdir() or member.isfile() or member.issym())
              for row in manifest['members']:
                  if row['kind']=='special-metadata':
                      assert row['inodeType'] in ['socket','fifo'] and row['contentsCaptured'] is False and row['restored'] is False and row['path'] not in members
                      assert all(k in row for k in ['mode','uid','gid','device','inode','size','mtimeNS','ctimeNS'])
                  elif row['kind']=='file':
                      member=members[row['path']];assert member.isfile() and member.size==row['size']
                      assert hashlib.sha256(archive.extractfile(member).read()).hexdigest()==row['sha256']
                  else:
                      member=members[row['path']];assert member.issym() and member.linkname==row['target']
              assert {name for name,m in members.items() if not m.isdir()}=={row['path'] for row in manifest['members'] if row['kind']!='special-metadata'}
          (evidence/'diagnostic-archive-consumer.json').write_text(json.dumps({'archiveSHA256':manifest['archiveSHA256'],'allRegularAndLinkMembersVerified':True,'specialInodesMetadataOnly':True,'restorableCompleteFilesystem':False},indent=2))
          PYARCHIVE
      - name: Retain complete raw provenance and bounded physical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewd-core14-orphan-recovery-${{ github.sha }}
          include-hidden-files: true
