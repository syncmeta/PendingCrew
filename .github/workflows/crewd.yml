  linux393-release:
    if: ${{ inputs.linux393_release == true && inputs.recovery_gate != true && inputs.linux_install_upgrade != true && inputs.linux14_install_recovery != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
