# 完整冻结后按影响范围显式运行；日常源码、文档和 PR 不自动重复重型检查。
# 本机与完整检查共用 crewd/scripts/check.sh；默认不跑真实模型或 ignored 测试。
# 已完成的临时 Core/M5/candidate 补验保留历史来源和本地脚本，不再暴露重复入口。
name: crewd
run-name: "${{ inputs.linux393_release == true && 'Linux current393 default Release package and affected recovery (explicit; not full CI)' || inputs.recovery_gate == true && 'Linux Core14 orphan recovery (explicit affected scope; not full CI)' || inputs.linux14_install_recovery == true && 'Linux14 fresh package and managed13-to14 crash recovery (explicit; not full CI)' || inputs.linux_install_upgrade == true && 'Linux ordinary-user isolated install/upgrade/rollback (explicit; not full CI)' || 'crewd frozen full checks (explicit)' }}"

on:
  workflow_dispatch:
    inputs:
      linux393_release:
        description: Exact reviewed current393 default Release package and only affected startup/crash recovery; no stable migration rerun
        type: boolean
        default: false
      recovery_gate:
        description: Exact reviewed Core14 Linux orphan registry, Store, startup and public/closed recovery scope; not full CI
        type: boolean
        default: false
      reviewed_ref:
        description: Required complete reviewed commit SHA for recovery_gate or linux393_release; must match the immutable run and checkout
        type: string
        default: ''
      linux_install_upgrade:
        description: Historical Linux11 to13 install, lease, unknown, rollback and restore flow instead of full checks
        type: boolean
        default: false

      linux14_install_recovery:
        description: Build the exact normal Linux14 package once and verify managed13-to14, unknown, rollback, backup/restore and nonempty-WAL crash recovery
        type: boolean
        default: false

concurrency:
  group: crewd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.146

jobs:
  check:
    if: ${{ inputs.linux_install_upgrade != true && inputs.linux14_install_recovery != true && inputs.recovery_gate != true && inputs.linux393_release != true }}
    name: crewd (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # 一个平台红了不要把另一个平台的结果也取消掉 —— 两边的红是不同的信息。
      fail-fast: false
      matrix:
        include:
          # macOS 是产品的真实运行平台（PTY、进程组、钥匙串），是权威的一份。
          # 和 ci.yml 一样用 macos-26，不用会漂移的 macos-latest。
          - name: macOS
            os: macos-26
          # Linux 用来抓「无意间依赖了 macOS」的平台假设；跑的范围见 crewd/README.md「CI」一节。
          - name: Linux
            os: ubuntu-latest
    defaults:
      run:
        working-directory: crewd
    steps:
      - uses: actions/checkout@v5

      # 工具链版本只有一个事实源：crewd/rust-toolchain.toml。这里读出来喂给 action，
      # 不在 workflow 里再写一遍数字。
      - name: 读取钉死的工具链版本
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml 里没读到 channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # 缓存键自动带 Cargo.lock 的哈希和 rustc 版本；workspaces 指到 crewd/。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crewd

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # fmt --check、clippy -D warnings、nextest（ci 档）、doctest —— 全在 check.sh 里。
      - name: scripts/check.sh
        env:
          CREWD_TEST_RUNNER: nextest
        run: scripts/check.sh

      # flaky-result = "fail" 已经让抖动使上一步变红；这一步只负责把「是哪几个测试抖了」
      # 写进 job 摘要，免得去翻 JUnit。上一步红或绿都跑。
      - name: 抖动测试清单
        if: always()
        run: |
          f=target/nextest/ci/junit.xml
          if [ ! -f "$f" ]; then
            echo "没有 JUnit（check.sh 在跑到 nextest 之前就失败了）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          flaky = []
          total = 0
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              total += 1
              if tc.find("flakyFailure") is not None or tc.find("flakyError") is not None:
                  flaky.append(f'{tc.get("classname")}::{tc.get("name")}')
          print(f"### crewd nextest：{total} 个测试，{len(flaky)} 个抖动（FLAKY）")
          for name in flaky:
              print(f"- `{name}`")
          PY

      - name: 上传 JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewd-junit-${{ matrix.name }}
          path: crewd/target/nextest/ci/junit.xml
          if-no-files-found: ignore

  linux-install-upgrade:
    if: ${{ inputs.linux_install_upgrade == true && inputs.linux14_install_recovery != true && inputs.recovery_gate != true && inputs.linux393_release != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify original accepted Linux11 run and canonical artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/linux-install-original-meta"
          gh api repos/${{ github.repository }}/actions/runs/38500948870 > "$RUNNER_TEMP/linux-install-original-meta/run.json"
          gh api repos/${{ github.repository }}/actions/artifacts/11866465185 > "$RUNNER_TEMP/linux-install-original-meta/artifact.json"
          python3 - <<'PYCONTROL'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-install-original-meta'
          run=json.loads((root/'run.json').read_text());artifact=json.loads((root/'artifact.json').read_text())
          assert run['id']==38500948870 and run['run_attempt']==1 and run['conclusion']=='success'
          assert run['head_sha']=='7b1849d97a813a1655ebafb66068a04a614e8787'
          assert artifact['id']==11866465185 and not artifact['expired']
          assert artifact['workflow_run']['id']==run['id'] and artifact['workflow_run']['head_sha']==run['head_sha']
          assert artifact['name']=='crewd-linux-candidate-'+run['head_sha']
          PYCONTROL
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11866465185'
          run-id: '38500948870'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-install-original-download
      - name: Verify and safely extract immutable original canonical tar
        run: |
          git status --porcelain > "$RUNNER_TEMP/linux-install-original-meta/checkout-before-verification.txt"
          python3 scripts/dev/prepare-crewd-linux-install-baseline.py "$RUNNER_TEMP/linux-install-original-download" "$RUNNER_TEMP/linux-install-baseline"
          git status --porcelain > "$RUNNER_TEMP/linux-install-original-meta/checkout-after-verification.txt"
          test ! -s "$RUNNER_TEMP/linux-install-original-meta/checkout-before-verification.txt"
          test ! -s "$RUNNER_TEMP/linux-install-original-meta/checkout-after-verification.txt"
      - name: Verify original failed run with successful actual normal13 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/38541835255 > "$RUNNER_TEMP/linux-install-original-meta/normal13-run.json"
          gh api repos/${{ github.repository }}/actions/artifacts/11882857926 > "$RUNNER_TEMP/linux-install-original-meta/normal13-artifact.json"
          gh api repos/${{ github.repository }}/actions/runs/38541835255/jobs > "$RUNNER_TEMP/linux-install-original-meta/normal13-jobs.json"
          python3 - <<'PYVERIFY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-install-original-meta'
          r=json.loads((p/'normal13-run.json').read_text());a=json.loads((p/'normal13-artifact.json').read_text());jobs=json.loads((p/'normal13-jobs.json').read_text())['jobs']
          assert r['id']==38541835255 and r['run_attempt']==1 and r['head_sha']=='4e80134b9b5ff5a9b759aed1446f61da489efc4c' and r['conclusion']=='failure'
          assert a['id']==11882857926 and not a['expired'] and a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert a['name']=='crewd-linux-install-upgrade-'+r['head_sha']
          job=next(j for j in jobs if j['name']=='linux-install-upgrade')
          assert next(x for x in job['steps'] if x['name']=='Build actual new default release with fresh owning-workspace proof and packaged recovery')['conclusion']=='success'
          PYVERIFY
      - name: Retrieve original artifact ZIP without expanding duplicated activation payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/11882857926/zip > "$RUNNER_TEMP/linux-install-normal13-original.zip"
      - name: Verify full current Rust equivalence and original strong-fresh normal13 package
        run: python3 scripts/dev/prepare-crewd-linux-install-reuse.py "$RUNNER_TEMP/linux-install-normal13-original.zip" "$RUNNER_TEMP/linux-install-new13"
      - name: Actual ordinary-user two-version managed install, upgrade, unknown, rollback and Core recovery
        id: lifecycle
        run: |
          parent=$(mktemp -d /tmp/pli.XXXXXX)
          chmod 700 "$parent"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          python3 scripts/dev/smoke-crewd-linux-install-upgrade.py "$RUNNER_TEMP/linux-install-baseline/crewd-linux-x86_64" "$RUNNER_TEMP/linux-install-new13/crewd-linux-x86_64" "$parent/flow" --new-schema 13
      - name: Archive private lifecycle without dereferencing activation references
        if: ${{ always() && steps.lifecycle.outputs.parent != '' }}
        run: python3 scripts/dev/archive-crewd-linux-lifecycle.py '${{ steps.lifecycle.outputs.parent }}/flow' "$RUNNER_TEMP/linux-install-lifecycle.tar.gz"
      - name: Preserve original and new complete provenance plus actual lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewd-linux-install-upgrade-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/linux-install-original-meta
            ${{ runner.temp }}/linux-install-new13/reused-normal13.json
            ${{ runner.temp }}/linux-install-lifecycle.tar.gz
            ${{ runner.temp }}/linux-install-lifecycle.tar.gz.json
          if-no-files-found: error
          retention-days: 14

  invalid-linux-scope:
    if: ${{ (inputs.linux_install_upgrade == true && inputs.linux14_install_recovery == true) || (inputs.recovery_gate == true && (inputs.linux_install_upgrade == true || inputs.linux14_install_recovery == true)) || (inputs.linux393_release == true && (inputs.linux_install_upgrade == true || inputs.linux14_install_recovery == true || inputs.recovery_gate == true)) }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Choose exactly one explicit Linux scope; no build started.' >&2; exit 1

  linux14-install-recovery:
    if: ${{ inputs.linux14_install_recovery == true && inputs.linux_install_upgrade != true && inputs.recovery_gate != true && inputs.linux393_release != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare exact original13 metadata evidence root
        run: mkdir -m 700 "$RUNNER_TEMP/linux-install-original-meta"
      - name: Verify original failed run with successful actual normal13 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/38541835255 > "$RUNNER_TEMP/linux-install-original-meta/normal13-run.json"
          gh api repos/${{ github.repository }}/actions/artifacts/11882857926 > "$RUNNER_TEMP/linux-install-original-meta/normal13-artifact.json"
          gh api repos/${{ github.repository }}/actions/runs/38541835255/jobs > "$RUNNER_TEMP/linux-install-original-meta/normal13-jobs.json"
          python3 - <<'PYVERIFY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux-install-original-meta'
          r=json.loads((p/'normal13-run.json').read_text());a=json.loads((p/'normal13-artifact.json').read_text());jobs=json.loads((p/'normal13-jobs.json').read_text())['jobs']
          assert r['id']==38541835255 and r['run_attempt']==1 and r['head_sha']=='4e80134b9b5ff5a9b759aed1446f61da489efc4c' and r['conclusion']=='failure'
          assert a['id']==11882857926 and not a['expired'] and a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert a['name']=='crewd-linux-install-upgrade-'+r['head_sha']
          job=next(j for j in jobs if j['name']=='linux-install-upgrade')
          assert next(x for x in job['steps'] if x['name']=='Build actual new default release with fresh owning-workspace proof and packaged recovery')['conclusion']=='success'
          PYVERIFY
      - name: Retrieve original artifact ZIP without expanding duplicated activation payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/11882857926/zip > "$RUNNER_TEMP/linux-install-normal13-original.zip"
      - name: Verify complete actual historical13 source and raw fresh proof as baseline only
        run: python3 -B scripts/dev/prepare-crewd-linux-install-reuse.py "$RUNNER_TEMP/linux-install-normal13-original.zip" "$RUNNER_TEMP/linux14-baseline13" --baseline13
      - name: Read pinned production Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTOOLCHAIN'
          import os,pathlib,tomllib
          channel=tomllib.loads(pathlib.Path('crewd/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('channel='+channel+'\n')
          PYTOOLCHAIN
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crewd -> target
          cache-on-failure: true
      - name: Prepare exact locked registry/source dependencies before offline metadata and build
        run: |
          mkdir -m 700 "$RUNNER_TEMP/linux14-dependency-preparation"
          sha256sum crewd/Cargo.toml crewd/Cargo.lock > "$RUNNER_TEMP/linux14-dependency-preparation/locked-inputs-before.sha256"
          git status --porcelain > "$RUNNER_TEMP/linux14-dependency-preparation/checkout-before.txt"
          test ! -s "$RUNNER_TEMP/linux14-dependency-preparation/checkout-before.txt"
          cargo fetch --locked --manifest-path crewd/Cargo.toml > "$RUNNER_TEMP/linux14-dependency-preparation/fetch.log" 2>&1
          sha256sum crewd/Cargo.toml crewd/Cargo.lock > "$RUNNER_TEMP/linux14-dependency-preparation/locked-inputs-after.sha256"
          cmp "$RUNNER_TEMP/linux14-dependency-preparation/locked-inputs-before.sha256" "$RUNNER_TEMP/linux14-dependency-preparation/locked-inputs-after.sha256"
          git status --porcelain > "$RUNNER_TEMP/linux14-dependency-preparation/checkout-after.txt"
          test ! -s "$RUNNER_TEMP/linux14-dependency-preparation/checkout-after.txt"
      - name: Build actual current14 default release once with complete owning-workspace fresh source proof
        run: python3 -B scripts/dev/build-crewd-linux-candidate.py "$RUNNER_TEMP/linux14-current-release"
      - name: Actual ordinary-user managed13-to14 upgrade, unknown, rollback, restore and SIGKILL WAL recovery
        id: lifecycle
        run: |
          parent=$(mktemp -d /tmp/pl14.XXXXXX)
          chmod 700 "$parent"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          python3 -B scripts/dev/smoke-crewd-linux-install-upgrade.py "$RUNNER_TEMP/linux14-baseline13/crewd-linux-x86_64" "$RUNNER_TEMP/linux14-current-release/crewd-linux-x86_64" "$parent/flow" --old-schema 13 --new-schema 14
      - name: Archive exact private lifecycle without dereferencing activation references
        if: ${{ always() && steps.lifecycle.outputs.parent != '' }}
        run: python3 -B scripts/dev/archive-crewd-linux-lifecycle.py '${{ steps.lifecycle.outputs.parent }}/flow' "$RUNNER_TEMP/linux14-lifecycle.tar.gz"
      - name: Retain full actual package provenance and precise lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewd-linux14-install-recovery-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/linux-install-original-meta
            ${{ runner.temp }}/linux14-dependency-preparation
            ${{ runner.temp }}/linux14-baseline13/reused-normal13.json
            ${{ runner.temp }}/linux14-baseline13/original4e-normal13.tar.gz
            ${{ runner.temp }}/linux14-current-release/crewd-linux-x86_64-*.tar.gz
            ${{ runner.temp }}/linux14-current-release/archive-sha256.txt
            ${{ runner.temp }}/linux14-current-release/runtime-smoke/*.log
            ${{ runner.temp }}/linux14-current-release/runtime-smoke/result.json
            ${{ runner.temp }}/linux14-lifecycle.tar.gz
            ${{ runner.temp }}/linux14-lifecycle.tar.gz.json
          if-no-files-found: error
          retention-days: 14

  linux-core14-recovery:
    if: ${{ inputs.recovery_gate == true && inputs.linux_install_upgrade != true && inputs.linux14_install_recovery != true && inputs.linux393_release != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/crewd/target
      PENDINGCREW_BUILD_BACKEND_PROFILE: debug
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Qualify exact reviewed recovery source before tooling, cache or build
        env:
          REVIEWED_REF: ${{ inputs.reviewed_ref }}
        run: |
          python3 - <<'PYREF'
          import json,os,pathlib,re,subprocess
          expected=os.environ['REVIEWED_REF'];run=os.environ['GITHUB_SHA']
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert re.fullmatch('[0-9a-f]{40}',expected) and expected==run==actual
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'core14-recovery';root.mkdir(mode=0o700)
          (root/'reviewed-source.json').write_text(json.dumps({'reviewedRef':expected,'runRef':run,'checkoutRef':actual,'sourceQualifiedBeforeTooling':True},indent=2))
          PYREF
      - name: Read exact source-pinned Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTOOLCHAIN'
          import os,pathlib,tomllib
          channel=tomllib.loads(pathlib.Path('crewd/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('channel='+channel+'\n')
          PYTOOLCHAIN
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crewd -> target
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Prepare complete locked dependencies once before offline compilation
        run: |
          sha256sum crewd/Cargo.toml crewd/Cargo.lock > "$RUNNER_TEMP/core14-recovery/locked-before.sha256"
          cargo fetch --locked --manifest-path crewd/Cargo.toml > "$RUNNER_TEMP/core14-recovery/fetch.log" 2>&1
          sha256sum crewd/Cargo.toml crewd/Cargo.lock > "$RUNNER_TEMP/core14-recovery/locked-after.sha256"
          cmp "$RUNNER_TEMP/core14-recovery/locked-before.sha256" "$RUNNER_TEMP/core14-recovery/locked-after.sha256"
          git status --porcelain > "$RUNNER_TEMP/core14-recovery/checkout-after-fetch.txt"
          test ! -s "$RUNNER_TEMP/core14-recovery/checkout-after-fetch.txt"
      - name: Default whole workspace formatting and strict all-target lint
        run: |
          cargo fmt --manifest-path crewd/Cargo.toml --all -- --check > "$RUNNER_TEMP/core14-recovery/fmt.log" 2>&1
          cargo clippy --manifest-path crewd/Cargo.toml --locked --offline --workspace --all-targets -- -D warnings > "$RUNNER_TEMP/core14-recovery/clippy.log" 2>&1
      - name: Exact recovery registry, Store and startup affected matrix
        run: |
          rm -f crewd/target/nextest/ci/junit.xml
          cargo nextest run --manifest-path crewd/Cargo.toml --locked --offline --profile ci -E '(package(crewd-exec) & test(registry::)) | (package(crewd-store) & test(recovery_guard_tests::)) | (package(crewd-server) & test(startup_reaps_registry_entries_and_clears_them))' > "$RUNNER_TEMP/core14-recovery/affected-nextest.log" 2>&1
      - name: Retain affected JUnit even on a failed matrix
        if: always()
        run: |
          if [ -f crewd/target/nextest/ci/junit.xml ] && [ -d "$RUNNER_TEMP/core14-recovery" ]; then
            cp crewd/target/nextest/ci/junit.xml "$RUNNER_TEMP/core14-recovery/affected-junit.xml"
          fi
      - name: One accurate default normal with complete fresh owning-workspace proof
        run: |
          python3 -B scripts/dev/record-crewd-build.py prepare "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core14-recovery/normal" "$GITHUB_SHA"
          python3 -B scripts/dev/record-crewd-build.py build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/core14-recovery/normal" "$GITHUB_WORKSPACE/crewd/target/debug/crewd" cargo build --offline --locked -p crewd --message-format=json
          python3 - <<'PYVERIFY'
          import hashlib,importlib.util,json,os,pathlib,subprocess
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE']);e=pathlib.Path(os.environ['RUNNER_TEMP'])/'core14-recovery'
          spec=importlib.util.spec_from_file_location('proof',repo/'scripts/dev/write-codex-first-provenance.py');p=importlib.util.module_from_spec(spec);spec.loader.exec_module(p)
          w=json.loads((e/'normal-witness.json').read_text())
          assert w['sourceRef']==os.environ['GITHUB_SHA'] and len(w['files'])==393
          tracked=subprocess.check_output(['git','ls-tree','-r','--name-only',os.environ['GITHUB_SHA'],'--','crewd']).decode().splitlines()
          current=[{'path':path,'sha256':hashlib.sha256(subprocess.check_output(['git','show',os.environ['GITHUB_SHA']+':'+path])).hexdigest()} for path in sorted(tracked)]
          assert sorted(w['files'],key=lambda row:row['path'])==current
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          value,root=p.verify_witness(e/'normal-witness.json',e/'normal/crewd-presign',w['rustInputDigest'],p.requested_configuration(repo/'crewd'),require_fresh=True)
          graph=json.loads((e/'normal/normal-production-graph.json').read_text())
          assert len(graph['requiredWorkspacePackages'])==11 and sum(len(x['targets']) for x in graph['requiredWorkspacePackages'])==12
          (e/'normal-independent-consumer.json').write_text(json.dumps({'sourceRef':value['sourceRef'],'rustInputs':393,'ownPackages':11,'ownTargets':12,'freshSourceVerified':True,'normalProfile':'debug'},indent=2))
          PYVERIFY
      - name: Separate synthetic producer artifacts with actual feature, source and hash proof
        run: |
          cargo build --manifest-path crewd/Cargo.toml --offline --locked -p crewd-exec --features testkit --bin fake_codex --bin fake_claude --message-format=json > "$RUNNER_TEMP/core14-recovery/fake-build.log" 2>&1
          python3 - <<'PYFAKE'
          import hashlib,json,os,pathlib,shutil,subprocess
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE']);e=pathlib.Path(os.environ['RUNNER_TEMP'])/'core14-recovery'
          meta=json.loads(subprocess.check_output(['cargo','metadata','--manifest-path','crewd/Cargo.toml','--no-deps','--locked','--offline','--format-version=1'],text=True))
          package=next(x for x in meta['packages'] if x['name']=='crewd-exec');saved=e/'fakes';saved.mkdir(mode=0o700);rows={}
          for line in (e/'fake-build.log').read_text().splitlines():
              try:v=json.loads(line)
              except json.JSONDecodeError:continue
              name=v.get('target',{}).get('name')
              if v.get('reason')!='compiler-artifact' or name not in ['fake_codex','fake_claude'] or not v.get('executable'):continue
              target=next(t for t in package['targets'] if t['name']==name)
              assert v['package_id']==package['id'] and pathlib.Path(v['manifest_path']).resolve()==pathlib.Path(package['manifest_path']).resolve()
              assert pathlib.Path(v['target']['src_path']).resolve()==pathlib.Path(target['src_path']).resolve() and v['profile']['test'] is False and v['features']==['testkit'] and v['fresh'] is False
              assert name not in rows
              source=pathlib.Path(v['executable']);dest=saved/name;shutil.copy2(source,dest)
              rows[name]={'packageID':v['package_id'],'manifestPath':v['manifest_path'],'sourcePath':v['target']['src_path'],'features':v['features'],'profile':v['profile'],'fresh':v['fresh'],'path':str(dest),'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
          assert set(rows)=={'fake_codex','fake_claude'}
          (e/'fake-artifacts.json').write_text(json.dumps(rows,indent=2))
          PYFAKE
      - name: Actual portable public and closed CLI recovery with true original group census
        id: physical
        run: |
          parent=$(mktemp -d /tmp/pcr.XXXXXX)
          chmod 700 "$parent"
          mkdir -m 700 "$parent/flow"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          exec > "$RUNNER_TEMP/core14-recovery/physical-driver.log" 2>&1
