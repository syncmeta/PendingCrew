          assert r['id']==38602193470 and r['run_attempt']==1 and r['conclusion']=='success' and r['head_sha']=='1533e69a901dd6c6c2be27cac11293cfd78117a0'
          assert a['id']==11913938011 and not a['expired'] and a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert a['name']=='crewd-linux14-install-recovery-'+r['head_sha']
