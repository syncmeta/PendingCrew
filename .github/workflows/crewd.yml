      PENDINGCREW_BUILD_BACKEND_PROFILE: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Qualify exact reviewed393 release source before tooling, cache or fetch
        id: source
        env:
          REVIEWED_REF: ${{ inputs.reviewed_ref }}
        run: |
          python3 - <<'PYREF'
          import hashlib,json,os,pathlib,re,subprocess
          ref=os.environ['REVIEWED_REF'];actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert re.fullmatch('[0-9a-f]{40}',ref) and ref==os.environ['GITHUB_SHA']==actual
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          e=pathlib.Path(os.environ['RUNNER_TEMP'])/'linux393';e.mkdir(mode=0o700)
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'crewd'],text=True).splitlines();rows=[]
          for path in sorted(paths):
              content=subprocess.check_output(['git','show',ref+':'+path]);assert pathlib.Path(path).read_bytes()==content
              rows.append({'path':path,'sha256':hashlib.sha256(content).hexdigest()})
          assert len(rows)==393 and hashlib.sha256(''.join(x['path']+'\t'+x['sha256']+'\n' for x in rows).encode()).hexdigest()=='530de912ebc0fb615f36ed444e7ed1867bcf72510b639f6467e5633195e09a06'
          inputs=['.github/workflows/crewd.yml','scripts/dev/build-crewd-linux-candidate.py','scripts/dev/check-crewd-linux-candidate.py','scripts/dev/prepare-crewd-linux393-release-baseline.py','scripts/dev/prepare-crewd-linux-install-reuse.py','scripts/dev/crewd_managed_launch.py','scripts/dev/install-crewd-linux-candidate.py','scripts/dev/archive-crewd-linux-lifecycle.py','scripts/dev/record-crewd-build.py','scripts/dev/write-codex-first-provenance.py','scripts/dev/fixtures/crewd_linux393_release_tail.py']
          rows=[]
          for path in inputs:
              content=subprocess.check_output(['git','show',ref+':'+path]);assert pathlib.Path(path).read_bytes()==content
              rows.append({'path':path,'sha256':hashlib.sha256(content).hexdigest()})
          (e/'source-action.json').write_text(json.dumps({'reviewedRef':ref,'runRef':os.environ['GITHUB_SHA'],'checkoutRef':actual,'qualifiedBeforeTooling':True,'additionalRecipeAndRuntimeInputs':rows},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('managed_sha='+next(x['sha256'] for x in rows if x['path']=='scripts/dev/crewd_managed_launch.py')+'\n')
          PYREF
      - name: Retrieve exact accepted1533 artifact holding original13 canonical baseline
