name: crewd Linux reviewed host package
run-name: "Linux host source ${{ inputs.source_sha }} / controller ${{ github.sha }}"
# Manual only. One normal build/package; never publish, install or run providers.
on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Full reviewed controller SHA, equal to this run SHA
        required: true
        type: string
      source_sha:
        description: Root-frozen complete B + clients + UI source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  host-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/crewd/target
      CONTROLLER_SHA: ${{ inputs.controller_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Initialize the evidence path on the runner
        run: printf 'HOST_EVIDENCE=%s/host-package\n' "${RUNNER_TEMP:?}" >> "${GITHUB_ENV:?}"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Bind both reviewed commits before tooling or cache
        run: python3 -I controller/scripts/dev/build-crewd-host-release.py bind
      - name: Read source-locked toolchain
        id: toolchain
        run: |
          python3 -I - <<'PY'
          import os,pathlib,tomllib
          channel=tomllib.loads(pathlib.Path('source/crewd/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('channel='+channel+'\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/crewd -> target
          cache-on-failure: true
      - name: Fetch locked dependencies once
        run: cargo fetch --locked --manifest-path source/crewd/Cargo.toml > "$HOST_EVIDENCE/fetch.log" 2>&1
      - name: Build one normal Release and one immutable host install tar
        working-directory: source/crewd
        run: python3 -I "$GITHUB_WORKSPACE/controller/scripts/dev/build-crewd-host-release.py" package
      - name: Preserve the single package and full original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewd-host-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-package/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: warn
